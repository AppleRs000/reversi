<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>リバーシ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>

  <!-- ===== メニュー画面 ===== -->
  <section id="menu" class="screen">
    <h1>リバーシ</h1>
    <p class="sub">対戦モードを選んでください</p>

    <fieldset class="modes">
      <legend class="sr-only">対戦モード</legend>
      <label class="mode">
        <input type="radio" name="mode" value="pvp" checked>
        <span><b>2人対戦</b><small>1台の画面で交代で打つ</small></span>
      </label>
      <label class="mode">
        <input type="radio" name="mode" value="weak">
        <span><b>CPU対戦：弱い</b><small>ランダムに打つ。初心者向け</small></span>
      </label>
      <label class="mode">
        <input type="radio" name="mode" value="normal">
        <span><b>CPU対戦：普通</b><small>2手先まで読む</small></span>
      </label>
      <label class="mode">
        <input type="radio" name="mode" value="strong">
        <span><b>CPU対戦：強い</b><small>5手先まで読み、終盤は完全読み</small></span>
      </label>
    </fieldset>

    <fieldset id="sideRow" class="sides" hidden>
      <legend>あなたの手番</legend>
      <label><input type="radio" name="side" value="1" checked> 黒（先手）</label>
      <label><input type="radio" name="side" value="2"> 白（後手）</label>
    </fieldset>

    <button id="startBtn" class="primary big">対局開始</button>

    <h2>勝敗数</h2>
    <table id="recordTable"></table>
    <button id="resetRecords" class="ghost small">勝敗数をリセット</button>
  </section>

  <!-- ===== ゲーム画面 ===== -->
  <section id="game" class="screen" hidden>
    <header class="topbar">
      <span id="gameModeLabel"></span>
      <span id="recordChip"></span>
    </header>

    <div class="scoreboard">
      <div id="panelBlack" class="panel">
        <span class="stone black"></span>
        <span class="pname" id="nameBlack">黒</span>
        <span class="pcount" id="countBlack">2</span>
      </div>
      <div id="panelWhite" class="panel">
        <span class="stone white"></span>
        <span class="pname" id="nameWhite">白</span>
        <span class="pcount" id="countWhite">2</span>
      </div>
    </div>

    <p id="message" role="status"></p>

    <div class="board-wrap">
      <div id="board" aria-label="リバーシ盤"></div>
      <div id="pauseOverlay" hidden>
        <p>一時停止中</p>
        <button id="resumeBtn" class="primary">再開</button>
      </div>
    </div>

    <div class="controls">
      <button id="passBtn">パス</button>
      <button id="assistBtn" aria-pressed="false">アシスト：OFF</button>
      <button id="resignBtn" class="danger">降参</button>
    </div>
    <div class="controls sys">
      <button id="pauseBtn">一時停止</button>
      <button id="stopBtn">停止</button>
      <button id="quitBtn">終了</button>
      <button id="againBtn" class="primary" hidden>もう一度</button>
    </div>
  </section>

</main>

<!-- ===== ダイアログ ===== -->
<div id="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true">
    <h3 id="modalTitle"></h3>
    <p id="modalText"></p>
    <div id="modalButtons"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
